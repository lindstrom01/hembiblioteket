# Databas
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:hembibliotek}
quarkus.datasource.password=${DB_PASSWORD:hembibliotek}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/hembibliotek}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# HTTP / CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

# Libris
quarkus.rest-client.libris.url=https://libris.kb.se
quarkus.rest-client.libris.connect-timeout=3000
quarkus.rest-client.libris.read-timeout=5000
quarkus.cache.caffeine."libris-lookup".expire-after-write=1H
quarkus.cache.caffeine."libris-lookup".maximum-size=500

# API-dokumentation: /q/openapi
quarkus.smallrye-openapi.info-title=Hembibliotek API
quarkus.smallrye-openapi.info-version=1.0.0

# Test: in-memory H2 i Postgres-läge, så testerna inte kräver Docker
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
